services:
  # MS2 se ejecuta sin proxy. Para desarrollo desde el host, usar
  # docker-compose.single.yml; para varias réplicas, escalar manualmente.
  document-service:
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    environment:
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
