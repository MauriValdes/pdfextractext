services:
  # ---------------------------------------------------------------
  # 1. Traefik como Reverse Proxy / Load Balancer (Puerto 80)
  # ---------------------------------------------------------------
  traefik:
    image: traefik:v3
    container_name: pdf_traefik
    restart: always
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=60s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=60s
      - --api.insecure=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------
  # 2. Extractor Service (API FastAPI - Stateless)
  # ---------------------------------------------------------------
  document-service:
    build: .
    restart: unless-stopped
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-5}
    labels:
      - traefik.enable=true
      - traefik.http.routers.document-service.rule=Host(`localhost`) || Host(`extract.universidad.localhost`) || PathPrefix(`/`)
      - traefik.http.routers.document-service.entrypoints=web
      - traefik.http.services.document-service.loadbalancer.server.port=8000